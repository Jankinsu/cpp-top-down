name: One-shot stage 0.6 sync

on:
  push:
    paths:
      - '.github/workflows/one-shot-stage06-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download exact Drive document
        shell: bash
        env:
          DOWNLOAD_URL: 'https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-8078-8206-85ce-cc242a3aef9d/raw?se=2026-10-26T08%3A13%3A16Z&sp=r&sv=2026-02-06&sr=b&scid=c1bcd7f4-0553-5471-a6e4-396401a644d2&skoid=1e4bb9ed-6bb5-424a-a3aa-79f21566e722&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-26T02%3A01%3A27Z&ske=2026-10-27T02%3A01%3A27Z&sks=b&skv=2026-02-06&sig=36rBwmveJrS%2Blj5Bx%2BDoPZMujC0ABEBE/wKcrBpnqR0%3D'
          TARGET_SHA: '4de41299a952564a6021e8e9f9312e70071c3fb4'
        run: |
          curl -L --fail --retry 2 "$DOWNLOAD_URL" -o "00-从源码到可执行程序.md"
          actual="$(git hash-object "00-从源码到可执行程序.md")"
          echo "target: $TARGET_SHA"
          echo "actual: $actual"
          test "$actual" = "$TARGET_SHA"

      - name: Commit synchronized document
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/one-shot-stage06-sync.yml
          git add "00-从源码到可执行程序.md" .github/workflows/one-shot-stage06-sync.yml
          git commit -m "docs: add stage 0.6 loader and virtual address space"
          git push
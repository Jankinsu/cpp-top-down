name: One-shot stage 0 navigation sync

on:
  push:
    paths:
      - '.github/workflows/one-shot-stage0-navigation.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Obsidian navigation structure
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib

          path = Path('00-从源码到可执行程序.md')
          s = path.read_text(encoding='utf-8')

          toc = '''## 目录与学习进度

          > 目录同时承担导航与进度管理：✅ 表示已完成，⬜ 表示待学习。章节按 Build Time → Load Time → Run Time 组织，先看系统阶段，再进入具体机制。

          ### Build Time：源码如何变成可执行文件

          - ✅ [[#0.1 总览：一个 C++ 程序从源码到运行经历什么|0.1 总览：从 .cpp 到 CPU 的完整链路]]
          - ✅ [[#0.2 Translation Unit：include、头文件与独立编译|0.2 Translation Unit：C++ 为什么能够独立编译]]
          - ✅ [[#0.3 Object File：.obj/.o、Section 与 Symbol|0.3 Object File：代码、数据、Symbol 最终存在哪里]]
          - ✅ [[#0.4 Linker：Symbol Resolution 与 Relocation|0.4 Linker：多个 Object File 如何拼成程序]]
          - ✅ [[#0.5 Library：静态库、动态库与依赖阶段|0.5 Library：程序依赖在哪个阶段被解决]]

          ### Load Time：磁盘文件如何变成进程

          - ⬜ [[#0.6 Loader：Executable 如何变成 Process|0.6 Loader：Executable 如何变成 Process]]
          - ⬜ [[#0.7 Runtime：为什么 main() 不是第一条指令|0.7 Runtime：main() 之前到底发生了什么]]

          ### Run Time：机器如何真正执行 C++

          - ⬜ [[#0.8 函数调用：Calling Convention 与 Stack Frame|0.8 函数调用：参数、寄存器与 Stack Frame]]
          - ⬜ [[#0.9 内存：Stack、Heap 与对象存储|0.9 内存：C++ 对象究竟存在哪里]]
          - ⬜ [[#0.10 调试：Debug Symbol、PDB 与 Release 优化|0.10 调试：源码如何重新映射到机器代码]]
          - ⬜ [[#0.11 ABI：Name Mangling 与 extern C|0.11 ABI：不同机器模块为什么能够互相调用]]
          - ⬜ [[#0.12 阶段总结：从源码重新走到 CPU|0.12 总结：重新走一遍源码 → CPU]]'''
          toc = '\n'.join(line[10:] if line.startswith('          ') else line for line in toc.splitlines())

          old = '# 0.1 一个 C++ 程序从源码到运行，经历了什么？'
          new = toc + '\n\n---\n\n# 0.1 总览：一个 C++ 程序从源码到运行经历什么'
          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          old = '这一整条系统链路。\n\n---\n---\n\n# 0.2 `#include`、头文件与 Translation Unit'
          new = '这一整条系统链路。\n\n---\n\n[[#目录与学习进度|↑ 返回目录]] · [[#0.2 Translation Unit：include、头文件与独立编译|下一节 → 0.2 Translation Unit]]\n\n---\n\n# 0.2 Translation Unit：include、头文件与独立编译'
          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          summary02 = '> `#include` 本质上是预处理阶段的文本包含；一个 `.cpp` 与其递归包含的内容共同形成 Translation Unit，并被独立编译。传统 C++ 中很多头文件规则，本质都来自“文本包含 + Translation Unit 独立编译”这一构建模型。'
          old = summary02 + '\n---\n\n# 0.3 `.obj/.o`、Section 与 Symbol'
          new = summary02 + '\n\n---\n\n[[#0.1 总览：一个 C++ 程序从源码到运行经历什么|← 上一节 0.1 总览]] · [[#目录与学习进度|↑ 返回目录]] · [[#0.3 Object File：.obj/.o、Section 与 Symbol|下一节 → 0.3 Object File]]\n\n---\n\n# 0.3 Object File：.obj/.o、Section 与 Symbol'
          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          old = '零部件已经真实存在，但装到整机哪个位置、连接谁、最终地址是多少，还没有完全确定。\n\n---\n\n# 0.4 Linker、Symbol Resolution 与 Relocation'
          new = '零部件已经真实存在，但装到整机哪个位置、连接谁、最终地址是多少，还没有完全确定。\n\n---\n\n[[#0.2 Translation Unit：include、头文件与独立编译|← 上一节 0.2 Translation Unit]] · [[#目录与学习进度|↑ 返回目录]] · [[#0.4 Linker：Symbol Resolution 与 Relocation|下一节 → 0.4 Linker]]\n\n---\n\n# 0.4 Linker：Symbol Resolution 与 Relocation'
          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          summary04 = '> **Linker 的本质，是把彼此独立编译、地址尚未最终确定的机器级模块重新组成一个完整程序：Symbol Resolution 解决“引用对应哪个定义”，Relocation 解决“最终位置确定以后机器代码或数据中的位置相关值该怎么修”。**'
          old = summary04 + '\n\n---\n\n# 0.5 静态库与动态库'
          new = summary04 + '\n\n---\n\n[[#0.3 Object File：.obj/.o、Section 与 Symbol|← 上一节 0.3 Object File]] · [[#目录与学习进度|↑ 返回目录]] · [[#0.5 Library：静态库、动态库与依赖阶段|下一节 → 0.5 Library]]\n\n---\n\n# 0.5 Library：静态库、动态库与依赖阶段'
          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          marker = '\n# 本阶段学习进度\n'
          assert s.count(marker) == 1
          s = s.split(marker, 1)[0].rstrip() + '\n\n---\n\n[[#0.4 Linker：Symbol Resolution 与 Relocation|← 上一节 0.4 Linker]] · [[#目录与学习进度|↑ 返回目录]] · [[#0.6 Loader：Executable 如何变成 Process|下一节 → 0.6 Loader]]\n'

          data = s.encode('utf-8')
          blob = hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest()
          expected = '03c537891ce2df1f140734051a7b2345f4685b23'
          print('bytes:', len(data), 'blob:', blob)
          assert len(data) == 73587
          assert blob == expected, (blob, expected)
          path.write_bytes(data)
          PY

      - name: Commit and remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/one-shot-stage0-navigation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: add Obsidian navigation to stage 0'
          git push
